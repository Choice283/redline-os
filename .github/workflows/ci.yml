name: CI

# Only tests/unit runs here — it's fully mocked (no real DaVinci Resolve
# involved). tests/integration requires a live Resolve Studio instance and
# is run manually on a real edit workstation; see docs/ARCHITECTURE.md §8.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow (depth-1) clone: Control
          # Room's checkpoint-resolution tests (tests/unit/control_room/
          # test_checkpoint_change_set.py) prove historical checkpoint
          # commits actually resolve via `git cat-file -e <sha>^{commit}`,
          # which requires those commit objects to be present locally.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        # Excludes the `workstation` tier: tests whose explicit subject
        # matter is Paul's real workstation identity (exact repository
        # path, exact Python 3.11.9 interpreter path, real production
        # workspace/evidence paths) and cannot be satisfied by any hosted
        # runner without weakening what they prove. See
        # docs/CI_TEST_ARCHITECTURE.md for the full portable/workstation
        # contract and how to run the workstation suite explicitly.
        run: pytest tests/unit -v -m "not workstation" --cov=redline_core --cov-report=term-missing
