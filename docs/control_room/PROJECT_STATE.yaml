# Durable semantic/operational state for the Redline OS project, as
# displayed by Control Room V0.
#
# This file stores meaning, not machine truth: current mission, latest
# checkpoint, validation posture, and whether the project needs founder
# attention. Live Git facts (branch, HEAD, working-tree/tracking
# condition) are deliberately NOT stored here -- Control Room reads those
# fresh from Git on every request. Mission history is also deliberately
# NOT stored here -- Control Room parses it fresh from closure documents
# under docs/control_room/. See docs/CONTROL_ROOM_V0_ARCHITECTURE.md.

